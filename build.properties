# NetBeans version - written into each package, and used as the build number of
# the NetBeans build. Should match the tag of the source release below.
netbeans.version=31

# NetBeans source release. Apache NetBeans GitHub releases ship source only -
# this is the source archive of the release tag, built from source with Ant.
netbeans.source.url=https://github.com/apache/netbeans/archive/refs/tags/31.zip
netbeans.source.sha=af7a608ae12541053a457bef076cf75341847f8199f6d3c0844cea76935f2e5990253d574883f7269dafa68e227f022824f44b29e5fef560bdf8d613da5c3a99

# Cluster configuration to build. See nbbuild/cluster.properties in the NetBeans
# sources for the available configurations. `release` matches the binaries of
# the Apache NetBeans release.
netbeans.cluster.config=release

